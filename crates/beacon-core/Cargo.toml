# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "beacon-core"
description = "Podcast library, feeds and services for Beacon, with no GTK dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono = "0.4.45"
reqwest = { version = "0.13.5", features = ["stream"] }
rss = { version = "2.1.2", default-features = false }
rusqlite = { version = "0.40", features = ["chrono", "url"] }
rusqlite_migration = "2.6.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs"] }
url = "2.5.8"

[dev-dependencies]
httpmock = "0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
