# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "beacon-gtk"
description = "Beacon, a podcast app for GNOME"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10"] }
async-channel = "2.5.0"
beacon-core = { path = "../beacon-core" }
chrono = "0.4.45"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gstreamer-play = { version = "0.25.0", features = ["v1_28"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_50", "v4_24"] }
mpris-server = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[build-dependencies]
glib-build-tools = "0.22.8"
